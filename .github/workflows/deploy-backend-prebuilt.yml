name: Deploy Backend (Prebuilt, SCP)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**"

permissions:
  contents: read

jobs:
  verify-content-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hunch_content_test
          POSTGRES_PASSWORD: hunch_content_test
          POSTGRES_DB: hunch_content_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hunch_content_test -d hunch_content_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      HUNCH_RUNTIME_SECRETS_LOADED: "1"
      NODE_ENV: test
      DATABASE_URL: postgresql://hunch_content_test:hunch_content_test@127.0.0.1:5432/hunch_content_test
      CONTENT_DATABASE_URL: postgresql://hunch_content_test:hunch_content_test@127.0.0.1:5432/hunch_content_test
      CONTENT_TEST_DATABASE_URL: postgresql://hunch_content_test:hunch_content_test@127.0.0.1:5432/hunch_content_test
      JWT_SECRET: content-ci-jwt-secret
      PRIVY_APP_ID: content-ci
      PRIVY_APP_SECRET: content-ci-secret
      CONTENT_WORKER_ENABLED: "false"
      CONTENT_PERF_ROWS: "50000"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build test dependency
        run: pnpm --filter @hunch/infra run build

      - name: Lint and typecheck content backend
        run: |
          pnpm --filter api run lint
          pnpm --filter api run typecheck
          pnpm --filter @hunch/db run lint
          pnpm --filter @hunch/db run typecheck

      - name: Apply content migrations twice
        run: |
          pnpm --filter @hunch/db run migrate:content
          pnpm --filter @hunch/db run migrate:content

      - name: Run content unit tests
        run: node --import tsx apps/api/src/content-tests.ts

      - name: Run content database and media tests
        run: |
          node --import tsx apps/api/src/content-integration-tests.ts
          node --import tsx apps/api/src/content-batching-tests.ts
          node --import tsx apps/api/src/content-concurrency-tests.ts
          node --import tsx apps/api/src/content-media-integration-tests.ts

      - name: Enforce content SQL performance plans
        run: node --import tsx apps/api/src/content-performance-tests.ts

  deploy:
    needs: verify-content-backend
    runs-on: ubuntu-24.04-arm
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        run: |
          docker buildx version
          docker buildx create --name hunch-builder --driver docker-container --use || docker buildx use hunch-builder
          docker buildx inspect --bootstrap

      - name: Start ssh-agent
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "${SSH_AUTH_SOCK}" >> "${GITHUB_ENV}"
          printf 'SSH_AGENT_PID=%s\n' "${SSH_AGENT_PID}" >> "${GITHUB_ENV}"
          printf '%s\n' "${SSH_PRIVATE_KEY}" | ssh-add -

      - name: Configure pinned known_hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "${SSH_HOST}" ]; then
            echo "SSH_HOST is required (set as a GitHub secret)." >&2
            exit 1
          fi
          if [ -z "${SSH_KNOWN_HOSTS}" ]; then
            echo "SSH_KNOWN_HOSTS secret is required and must contain the pinned host key line(s)." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy backend (prebuilt)
        env:
          REMOTE_HOST: ubuntu@${{ secrets.SSH_HOST }}
          PLATFORM: linux/arm64
          LOCAL_IMAGE_CLEANUP: "1"
          LOCAL_BUILDER_PRUNE: "0"
        run: |
          chmod +x ops/deploy-local-prebuilt.sh
          ops/deploy-local-prebuilt.sh
